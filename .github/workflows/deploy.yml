name: CI/CD Deploy to Render
on:
  push:
    branches: [ "main" ] # Hoặc branch nào ông đang dùng

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew clean war

      - name: Build & Push Docker Image
        # Đoạn này ông dùng lệnh của Render hoặc Docker Hub tùy ý
        # Nhưng đơn giản nhất là để Render tự kéo từ GitHub.
        run: echo "Build successful, notifying Render..."